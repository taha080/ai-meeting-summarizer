[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-summarizer"
version = "0.1.0"
description = "Summarize meeting audio or transcripts into action items and decisions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["meetings", "summarization", "openai", "whisper"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai>=1.40.0",
    "typer>=0.12.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
summarize = "meeting_summarizer.cli:main"
meeting-web = "meeting_summarizer.web.app:main"

[project.urls]
Homepage = "https://github.com/taha080/ai-meeting-summarizer"
Repository = "https://github.com/taha080/ai-meeting-summarizer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meeting_summarizer = ["py.typed"]
"meeting_summarizer.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
